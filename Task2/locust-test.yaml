apiVersion: batch/v1
kind: Job
metadata:
  name: locust-test
spec:
  template:
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.15.1
          env:
            - name: LOCUST_MODE
              value: "standalone"
            - name: TARGET_HOST
              value: "http://scaletestapp-service:80"
          command: ["/bin/sh"]
          args:
            - -c
            - |
              cat > /locust/locustfile.py << 'EOF'
              from locust import HttpUser, task, between
              
              class ScaletestUser(HttpUser):
                  wait_time = between(1, 5)  
              
                  @task
                  def ping(self):
                      self.client.get("/")
              EOF
              locust -f /locust/locustfile.py \
                     --headless -u 1500 -r 5 --run-time 5m \
                     --host $$TARGET_HOST --logfile /dev/stdout
          volumeMounts:
            - name: locust-data
              mountPath: /locust
      volumes:
        - name: locust-data
          emptyDir: {}
      restartPolicy: Never